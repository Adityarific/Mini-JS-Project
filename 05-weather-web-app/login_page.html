<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="login_page.css">
    <link href='https://cdn.boxicons.com/fonts/basic/boxicons.min.css' rel='stylesheet'>
</head>
<body>
    
    <div class="box">
        <div class="search-box">
                <i class='bx  bx-location-alt-2'></i>
                <input type="text" placeholder="Enter Your Location">
                <button class="bx  bx-search"></button>
        </div>
        <div class="weather-box">
            <img src="images/cloud.png" alt="Weather Icon">
            <p class="city">New York</p>
            <p class="temperature">25<span>°C</span></p>
            <p class="description">Partly Cloudy</p>
        </div>
        <div class="weather-info">
            <div class="wind">
                <div class="wind-icon">
                    <i class='bx  bx-wind'  ></i> 
                    <p class="wind-speed">22</p>
                    <p class="wind-unit">km/h</p>
                </div>
                <p class="wind-disc">Speed</p>
            </div>
            <div class="mist">
                <div class="mist-icon">
                    <i class='bx  bx-air'  ></i> 
                    <p class="mist-speed">18</p>
                    <p class="mist-unit">%</p>
                </div>
                <p class="mist-disc">Humidity</p>
            </div>
        </div>
    </div>
    <script src="login_page.js"></script>
</body>
